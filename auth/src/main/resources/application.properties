spring.application.name=auth
#
spring.threads.virtual.enabled=true
# <.>
spring.security.oauth2.authorizationserver.client.crm.registration.client-id=crm
spring.security.oauth2.authorizationserver.client.crm.registration.client-secret={noop}crm
spring.security.oauth2.authorizationserver.client.crm.registration.client-authentication-methods[0]=client_secret_basic
# <.>
spring.security.oauth2.authorizationserver.client.crm.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.crm.registration.authorization-grant-types[1]=refresh_token
# <.>
spring.security.oauth2.authorizationserver.client.crm.registration.redirect-uris[0]=http://127.0.0.1:8080/login/oauth2/code/crm
# <.>
spring.security.oauth2.authorizationserver.client.crm.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.crm.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.crm.registration.scopes[2]=email.send
# <.>
server.port=9090
